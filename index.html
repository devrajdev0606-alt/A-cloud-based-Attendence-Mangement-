<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CIT Portal Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background Layer -->
  <div class="bg-scene">
    <div class="overlay"></div>
  </div>

  <!-- Floating decorative icons -->
  <div class="floating-icon cap">🎓</div>
  <div class="floating-icon globe">🌐</div>
  <div class="floating-icon cap cap-2">🎓</div>

  <main class="page-wrap">
    <section class="portal-card">
      <!-- Header -->
      <header class="portal-header">
        <div class="logo-placeholder">
          <img src="cit logo.png" alt="CIT Logo" class="cit-logo" />
        </div>
        <h1>WELCOME TO <span>CIT PORTAL</span></h1>
      </header>

      <!-- Login Columns -->
      <section class="login-columns">
        <!-- Student -->
        <article class="login-panel student">
          <div class="panel-head">
            <div class="panel-icon">👨‍🎓</div>
            <h2>STUDENT LOGIN</h2>
          </div>

          <label class="input-wrap">
            <span class="input-icon">👤</span>
            <input type="text" placeholder="Student ID / Email" />
          </label>

          <label class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" placeholder="Password" />
          </label>

          <a href="#" class="forgot">Forgot Password?</a>
          <button class="btn btn-student">LOGIN AS STUDENT</button>
        </article>

        <!-- Teacher -->
        <article class="login-panel teacher">
          <div class="panel-head">
            <div class="panel-icon">👩‍🏫</div>
            <h2>TEACHER LOGIN</h2>
          </div>

          <label class="input-wrap">
            <span class="input-icon">📧</span>
            <input type="text" placeholder="Teacher Email" />
          </label>

          <label class="input-wrap">
            <span class="input-icon">🔒</span>
            <input type="password" placeholder="Password" />
          </label>

          <a href="#" class="forgot">Forgot Password?</a>
          <button class="btn btn-teacher">LOGIN AS TEACHER</button>
        </article>
      </section>

      <!-- Registration -->
      <section class="register-section">
        <h3>First Time Here?</h3>
        <p>New to <strong>CIT</strong> Portal? Create your account today!</p>

        <div class="register-actions">
          <button class="btn-register student-reg"><span>＋</span> REGISTER AS NEW STUDENT</button>
          <button class="btn-register teacher-reg"><span>＋</span> REGISTER AS NEW TEACHER</button>
        </div>
      </section>
    </section>
  </main>

  <!-- Footer -->
  <footer class="portal-footer">
    <a href="#">About Us</a>
    <a href="#">Contact Support</a>
    <a href="#">Privacy Policy</a>
    <a href="#">Terms of Service</a>
  </footer>
</body>
</html>
