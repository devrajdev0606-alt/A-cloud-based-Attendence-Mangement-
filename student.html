<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Login - CIT Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background Scene -->
  <div class="bg-scene">
    <div class="overlay"></div>
  </div>

  <main class="page-wrap" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
    <div style="width: 100%; max-width: 420px;">
      <a href="index.html" class="back-btn" style="margin-bottom: 20px;">← Back to Portal Home</a>
      
      <div class="card" style="padding: 32px 28px; box-shadow: var(--shadow-glass);">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="logo-placeholder" style="margin: 0 auto 14px; width: 52px; height: 52px;">
            <img src="cit logo.jpg" alt="CIT Logo" class="cit-logo" />
          </div>
          <h1 style="font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; color: var(--primary-navy);">Student Login</h1>
          <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Enter your institutional credentials to continue</p>
        </div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 14px;">
          <div>
            <label class="form-label" for="email">Student Email</label>
            <div class="input-wrap" style="margin-bottom: 0;">
              <span class="input-icon">👤</span>
              <input type="email" id="email" placeholder="student@cit.edu" required autocomplete="username" />
            </div>
          </div>

          <div>
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap" style="margin-bottom: 0;">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            </div>
          </div>

          <button type="submit" class="btn login-btn" style="width: 100%; margin-top: 8px;">Login to Portal</button>
        </form>

        <div id="loginMsg" class="msg"></div>

        <div style="text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-light); font-size: 0.85rem; color: var(--text-muted);">
          New student? <a href="student-register.html" style="color: var(--accent-blue); font-weight: 600; text-decoration: none;">Register account here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const db = firebase.firestore();
    const auth = firebase.auth();

    if (localStorage.getItem('studentId')) {
      window.location.replace('dashboard.html');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      msg.style.display = 'none';
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();

      try {
        // 1. Authenticate with Firebase Authentication
        let user = null;
        try {
          const userCred = await auth.signInWithEmailAndPassword(email, password);
          user = userCred.user;
        } catch (authErr) {
          msg.textContent = 'Invalid email or password';
          msg.className = 'msg error';
          msg.style.display = 'block';
          return;
        }

        // 2. Check if approved student profile exists (by UID or email)
        let studentDoc = await db.collection('students').doc(user.uid).get();
        let student = null;
        let studentId = user.uid;

        if (studentDoc.exists) {
          student = studentDoc.data();
        } else {
          // Fallback check by email (for legacy profiles)
          const emailSnap = await db.collection('students').where('email', '==', email).get();
          if (!emailSnap.empty) {
            studentDoc = emailSnap.docs[0];
            student = studentDoc.data();
            studentId = studentDoc.id;
          }
        }

        if (student) {
          localStorage.setItem('studentId', studentId);
          localStorage.setItem('studentUid', user.uid);
          localStorage.setItem('studentName', student.name || 'Student');
          localStorage.setItem('studentUsn', student.usn || '');
          localStorage.setItem('studentDept', student.dept || student.department || '');
          localStorage.setItem('studentSemester', student.semester ? String(student.semester) : '');
          localStorage.setItem('studentSection', student.section || '');
          localStorage.setItem('faceRegistered', student.faceRegistered ? 'true' : 'false');
          window.location.href = 'dashboard.html';
          return;
        }

        // 3. If no active student profile, check registration request status
        const reqDoc = await db.collection('registrationRequests').doc(user.uid).get();
        let reqData = reqDoc.exists ? reqDoc.data() : null;

        if (!reqData) {
          const reqSnap = await db.collection('registrationRequests').where('email', '==', email).get();
          if (!reqSnap.empty) {
            reqData = reqSnap.docs[0].data();
          }
        }

        await auth.signOut();
        localStorage.clear();

        if (reqData && reqData.status === 'pending') {
          msg.textContent = 'Your registration is awaiting administrator approval.';
          msg.className = 'msg info';
          msg.style.display = 'block';
          return;
        } else if (reqData && reqData.status === 'rejected') {
          msg.textContent = 'Your registration was rejected. Please contact the administration.';
          msg.className = 'msg error';
          msg.style.display = 'block';
          return;
        }

        msg.textContent = 'Invalid email or password';
        msg.className = 'msg error';
        msg.style.display = 'block';
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'msg error';
        msg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
