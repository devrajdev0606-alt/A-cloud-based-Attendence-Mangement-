<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Login - CIT Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background Scene -->
  <div class="bg-scene">
    <div class="overlay"></div>
  </div>

  <main class="page-wrap" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
    <div style="width: 100%; max-width: 420px;">
      <a href="index.html" class="back-btn" style="margin-bottom: 20px;">← Back to Portal Home</a>
      
      <div class="card" style="padding: 32px 28px; box-shadow: var(--shadow-glass);">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="logo-placeholder" style="margin: 0 auto 14px; width: 52px; height: 52px;">
            <img src="cit logo.jpg" alt="CIT Logo" class="cit-logo" />
          </div>
          <h1 style="font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; color: var(--primary-navy);">Faculty Login</h1>
          <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Enter your teacher credentials to continue</p>
        </div>

        <form id="loginForm" style="display: flex; flex-direction: column; gap: 14px;">
          <div>
            <label class="form-label" for="email">Faculty Email</label>
            <div class="input-wrap" style="margin-bottom: 0;">
              <span class="input-icon">📧</span>
              <input type="email" id="email" placeholder="faculty@cit.edu" required autocomplete="username" />
            </div>
          </div>

          <div>
            <label class="form-label" for="password">Password</label>
            <div class="input-wrap" style="margin-bottom: 0;">
              <span class="input-icon">🔒</span>
              <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            </div>
          </div>

          <button type="submit" class="btn btn-teacher login-btn" style="width: 100%; margin-top: 8px;">Login to Portal</button>
        </form>

        <div id="loginMsg" class="msg"></div>

        <div style="text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-light); font-size: 0.85rem; color: var(--text-muted);">
          New faculty member? <a href="teacher-register.html" style="color: var(--teacher-dark); font-weight: 600; text-decoration: none;">Register account here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const db = firebase.firestore();

    if (localStorage.getItem('facultyId')) {
      window.location.replace('faculty_dashboard.html');
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('loginMsg');
      msg.style.display = 'none';
      const email = document.getElementById('email').value.trim().toLowerCase();
      const password = document.getElementById('password').value.trim();
      try {
        const snapshot = await db.collection('faculty').where('email', '==', email).get();
        if (!snapshot.empty) {
          const faculty = snapshot.docs[0].data();
          const facultyId = snapshot.docs[0].id;
          if (faculty.password !== password) {
            msg.textContent = 'Invalid email or password';
            msg.className = 'msg error';
            msg.style.display = 'block';
            return;
          }
          localStorage.setItem('facultyId', facultyId);
          localStorage.setItem('facultyName', faculty.name);
          localStorage.setItem('facultyDept', faculty.department);
          window.location.href = 'faculty_dashboard.html';
          return;
        }

        // Check if teacher registration request is pending or rejected
        const reqSnap = await db.collection('registrationRequests')
          .where('email', '==', email)
          .where('role', '==', 'faculty')
          .get();

        if (!reqSnap.empty) {
          const reqData = reqSnap.docs[0].data();
          if (reqData.status === 'pending') {
            msg.textContent = 'Your registration is still awaiting administrator approval.';
            msg.className = 'msg info';
            msg.style.display = 'block';
            return;
          } else if (reqData.status === 'rejected') {
            msg.textContent = 'Your registration was rejected. Please contact the administration.';
            msg.className = 'msg error';
            msg.style.display = 'block';
            return;
          }
        }

        msg.textContent = 'Invalid email or password';
        msg.className = 'msg error';
        msg.style.display = 'block';
      } catch (err) {
        msg.textContent = 'Error: ' + err.message;
        msg.className = 'msg error';
        msg.style.display = 'block';
      }
    });
  </script>
</body>
</html>
