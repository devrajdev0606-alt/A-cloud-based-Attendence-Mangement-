<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Faculty Registration - CIT Attendance Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Background Scene -->
  <div class="bg-scene">
    <div class="overlay"></div>
  </div>

  <main class="page-wrap" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 24px;">
    <div style="width: 100%; max-width: 460px;">
      <a href="index.html" class="back-btn" style="margin-bottom: 20px;">← Back to Portal Home</a>
      
      <div class="card" style="padding: 32px 28px; box-shadow: var(--shadow-glass);">
        <div style="text-align: center; margin-bottom: 24px;">
          <div class="logo-placeholder" style="margin: 0 auto 14px; width: 52px; height: 52px;">
            <img src="cit logo.jpg" alt="CIT Logo" class="cit-logo" />
          </div>
          <span class="badge" style="background:var(--teacher-subtle); color:var(--teacher-dark); border-color:var(--teacher-border); margin-bottom: 8px;">👩‍🏫 Faculty Portal</span>
          <h1 style="font-family: var(--font-display); font-size: 1.45rem; font-weight: 800; color: var(--primary-navy); margin-top: 4px;">Faculty Registration</h1>
          <p style="color: var(--text-muted); font-size: 0.88rem; margin-top: 4px;">Create your teacher profile to manage sessions</p>
        </div>

        <form id="facultyRegisterForm" style="display: flex; flex-direction: column; gap: 14px;">
          <div>
            <label class="form-label" for="name">Faculty Name & Title *</label>
            <div class="input-wrap" style="margin-bottom: 0;">
              <span class="input-icon">👤</span>
              <input type="text" id="name" placeholder="Prof. Alan Smith" required />
            </div>
          </div>

          <div>
            <label class="form-label" for="email">Teacher Institutional Email *</label>
            <div class="input-wrap" style="margin-bottom: 0;">
              <span class="input-icon">📧</span>
              <input type="email" id="email" placeholder="faculty@cit.edu" required autocomplete="username" />
            </div>
          </div>

          <div>
            <label class="form-label" for="dept">Academic Department *</label>
            <select id="dept" required>
              <option value="">-- Select Department --</option>
            </select>
          </div>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <div>
              <label class="form-label" for="password">Password *</label>
              <div class="input-wrap" style="margin-bottom: 0;">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" placeholder="Min 6 chars" required minlength="6" autocomplete="new-password" />
              </div>
            </div>
            <div>
              <label class="form-label" for="confirmPassword">Confirm *</label>
              <div class="input-wrap" style="margin-bottom: 0;">
                <span class="input-icon">🔒</span>
                <input type="password" id="confirmPassword" placeholder="Repeat pass" required minlength="6" autocomplete="new-password" />
              </div>
            </div>
          </div>

          <button type="submit" id="submitBtn" class="btn btn-teacher" style="width: 100%; margin-top: 8px;">Create Faculty Account</button>
        </form>

        <div id="regMsg" class="msg"></div>

        <div style="text-align: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border-light); font-size: 0.85rem; color: var(--text-muted);">
          Already have an account? <a href="faculty.html" style="color: var(--teacher-dark); font-weight: 600; text-decoration: none;">Login here</a>
        </div>
      </div>
    </div>
  </main>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>
  <script>
    const db = firebase.firestore();
    const auth = firebase.auth();

    if (localStorage.getItem('facultyId')) {
      window.location.replace('faculty_dashboard.html');
    }

    let cachedDepartmentsList = null;
    let departmentsFetchPromise = null;

    async function fetchDepartmentsOnce(forceRefresh = false) {
      if (!forceRefresh && cachedDepartmentsList !== null) {
        return cachedDepartmentsList;
      }
      if (departmentsFetchPromise) {
        return departmentsFetchPromise;
      }
      departmentsFetchPromise = (async () => {
        try {
          const snap = await db.collection('departments').orderBy('name').get();
          console.log(`[Departments] Firestore records received: ${snap.size}`);
          const uniqueMap = new Map();
          snap.forEach(doc => {
            const data = doc.data();
            const rawName = (data.name || '').trim();
            if (!rawName) return;
            const normalizedKey = (data.normalizedName || rawName).toLowerCase();
            if (!uniqueMap.has(normalizedKey)) {
              uniqueMap.set(normalizedKey, {
                id: doc.id,
                name: rawName,
                normalizedName: normalizedKey
              });
            }
          });
          cachedDepartmentsList = Array.from(uniqueMap.values());
          console.log(`[Departments] Unique departments: ${cachedDepartmentsList.length}`);
          return cachedDepartmentsList;
        } catch (err) {
          console.error('[Departments] Error fetching departments:', err);
          return cachedDepartmentsList || [];
        } finally {
          departmentsFetchPromise = null;
        }
      })();
      return departmentsFetchPromise;
    }

    async function loadDepartments(forceRefresh = false) {
      console.log('[Departments] loadDepartments called');
      const deptSelect = document.getElementById('dept');
      if (!deptSelect) return;
      const currentVal = deptSelect.value;
      const depts = await fetchDepartmentsOnce(forceRefresh);
      
      deptSelect.innerHTML = '<option value="">-- Select Department --</option>';
      depts.forEach(d => {
        const opt = document.createElement('option');
        opt.value = d.id;
        opt.textContent = d.name;
        deptSelect.appendChild(opt);
      });
      if (currentVal) deptSelect.value = currentVal;
      console.log(`[Departments] Populating dropdown: facultyDepartment (total options: ${deptSelect.options.length})`);
    }

    loadDepartments();

    document.getElementById('facultyRegisterForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('regMsg');
      const submitBtn = document.getElementById('submitBtn');

      const name = document.getElementById('name').value.trim();
      const email = document.getElementById('email').value.trim().toLowerCase();
      const dept = document.getElementById('dept').value;
      const pass = document.getElementById('password').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (!email) {
        msg.textContent = 'Please enter a valid Teacher Institutional Email.';
        msg.className = 'msg error';
        msg.style.display = 'block';
        return;
      }

      if (pass !== confirmPass) {
        msg.textContent = 'Passwords do not match.';
        msg.className = 'msg error';
        msg.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = 'Submitting Request...';
      msg.style.display = 'none';

      let createdAuthUser = null;
      try {
        // 1. Check unique email in uniqueEmails, faculty, and pending registrationRequests
        const emailDoc = await db.collection('uniqueEmails').doc(email).get().catch(() => null);
        if (emailDoc && emailDoc.exists) {
          msg.textContent = 'Faculty with this email already exists.';
          msg.className = 'msg error';
          msg.style.display = 'block';
          return;
        }

        const emailSnap = await db.collection('faculty').where('email', '==', email).get().catch(() => null);
        if (emailSnap && !emailSnap.empty) {
          msg.textContent = 'Faculty with this email already exists.';
          msg.className = 'msg error';
          msg.style.display = 'block';
          return;
        }

        const pendingEmailSnap = await db.collection('registrationRequests').where('email', '==', email).where('status', '==', 'pending').get().catch(() => null);
        if (pendingEmailSnap && !pendingEmailSnap.empty) {
          msg.textContent = 'Faculty with this email already exists.';
          msg.className = 'msg error';
          msg.style.display = 'block';
          return;
        }

        // 2. Create Firebase Authentication account securely
        const userCred = await auth.createUserWithEmailAndPassword(email, pass);
        createdAuthUser = userCred.user;
        const uid = createdAuthUser.uid;

        // 3. Create registration request in Firestore keyed by UID (NO password stored)
        const newRequest = {
          uid: uid,
          role: 'faculty',
          name: name,
          email: email,
          department: dept,
          status: 'pending',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        await db.collection('registrationRequests').doc(uid).set(newRequest);

        // 4. Sign out immediately so pending user is not left authenticated in session
        await auth.signOut();

        msg.textContent = 'Registration submitted successfully. Your account is waiting for administrator approval.';
        msg.className = 'msg success';
        msg.style.display = 'block';

        document.getElementById('facultyRegisterForm').reset();
      } catch (err) {
        // Rollback orphaned Firebase Auth account if Firestore request write fails
        if (createdAuthUser) {
          try { await createdAuthUser.delete(); } catch (e) {}
        }
        let errorMsg = err.message;
        if (err.code === 'auth/email-already-in-use') {
          errorMsg = 'Faculty with this email already exists.';
        }
        msg.textContent = errorMsg;
        msg.className = 'msg error';
        msg.style.display = 'block';
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Faculty Account';
      }
    });
  </script>
</body>
</html>
